---
- name: Install Clickhouse
  hosts: clickhouse
  become: true
  vars:
    clickhouse_key_url: "https://packages.clickhouse.com/rpm/clickhouse-key.gpg"
    clickhouse_repo_url: "https://packages.clickhouse.com/deb"
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
 # Ключ лежит в rpm-папке, но это тот же самый ключ — он подходит и для DEB
  tasks:
    - name: Install apt dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes
      become: true

    # Скачиваем GPG-ключ (теперь точно рабочий URL)
    - name: Download ClickHouse GPG key
      get_url:
        url: "{{ clickhouse_key_url }}"
        dest: "/usr/share/keyrings/clickhouse-keyring.gpg"
        mode: "0644"
      become: true

    # Создаём репо-файл с modern signed-by
    - name: Configure ClickHouse repository
      copy:
        content: |
          deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] {{ clickhouse_repo_url }} stable main
        dest: /etc/apt/sources.list.d/clickhouse.list
        owner: root
        group: root
        mode: '0644'
      become: true

    # Отдельный шаг для обновления кэша: тут сразу видно ошибки ключа
    - name: Update apt cache
      apt:
        update_cache: yes
      become: true

    - name: Install ClickHouse packages
      apt:
        name: "{{ clickhouse_packages }}"
        state: present
      become: true
      
    - name: Flush handlers
      meta: flush_handlers
    
    - name: Create database
      ansible.builtin.command: >-
        "clickhouse-client -q 'create database logs;'"
        register: create_db
        failed_when: create_db.rc != 0 and create_db.rc !=82
        changed_when: create_db.rc == 0
      tags:
        - db

    - name: Enable and start ClickHouse service
      ansible.builtin.systemd:
        name: clickhouse-server
        enabled: true
        state: started
      notify: Restart ClickHouse
      tags:
        - service

- name: Install and configure Vector
  hosts: clickhouse
  become: true
  vars:
    vector_version: "0.35.0"
    vector_download_url: >-
      https://github.com/timberio/vector/releases/download/
      v{{ vector_version }}/vector-{{B vector_version }}-x86_64-unknown-linux-gnu.tar.gz
    vector_install_dir: "/opt/vector"
    vector_bin_dir: "{{ vector_install_dir }}/bin"
    vector_config_path: "/etc/vector/vector.yaml"

  tasks:
    - name: Create directories for Vector installation and config
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_bin_dir }}"
        - "/etc/vector"

    - name: Download Vector distribution
      ansible.builtin.get_url:
        url: "{{ vector_download_url }}"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: "0644"

    - name: Unarchive Vector distribution
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        creates: "{{ vector_bin_dir }}/vector"

    - name: Ensure Vector binary is executable
      ansible.builtin.file:
        path: "{{ vector_bin_dir }}/vector"
        mode: "0755"

    - name: Deploy Vector configuration from Jinja2 template
      ansible.builtin.template:
        src: "templates/vector.yaml.j2"
        dest: "{{ vector_config_path }}"
        mode: "0644"
      notify: Restart Vector

    - name: Create systemd unit for Vector
      ansible.builtin.copy:
        dest: "/etc/systemd/system/vector.service"
        mode: "0744"
        content: |
          [Unit]
          Description=Vector observability pipeline
          After=network.target

          [Service]
          ExecStart={{ vector_bin_dir }}/vector --config {{ vector_config_path }}
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
      register: vector_service_file
      changed_when: vector_service_file.diff.added is defined

    - name: Reload systemd and ensure Vector service is enabled and started
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
      when: vector_service_file.changed or (ansible_services["vector"] is not defined)


  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
